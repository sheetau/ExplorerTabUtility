name: Build and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net9.0-windows, net481]
        arch: [x64, x86, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build application and acceptance harness
        shell: pwsh
        run: msbuild ExplorerTabUtility.sln /restore /p:Configuration=Release /p:TargetFramework=${{ matrix.framework }} /v:minimal
      - name: Publish
        shell: pwsh
        run: msbuild ExplorerTabUtility/ExplorerTabUtility.csproj /restore /t:Publish /p:Configuration=Release /p:TargetFramework=${{ matrix.framework }} /p:RuntimeIdentifier=win-${{ matrix.arch }} /p:PublishDir=../publish/${{ matrix.framework }}/${{ matrix.arch }}/ /v:minimal
      - name: Package
        id: package
        shell: pwsh
        run: |
          $runtime = if ('${{ matrix.framework }}' -eq 'net481') { 'NetFW4.8.1' } else { 'Net9.0_FrameworkDependent' }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v2.5.4-' + $env:GITHUB_SHA.Substring(0, 7) }
          $name = "ExplorerTabUtility_$($version)_${{ matrix.arch }}_$runtime.zip"
          $source = 'publish/${{ matrix.framework }}/${{ matrix.arch }}'
          Copy-Item -LiteralPath LICENSE -Destination "$source/LICENSE"
          Copy-Item -LiteralPath README.md -Destination "$source/README.md"
          Compress-Archive -Path "$source/*" -DestinationPath $name
          "name=$name" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/*.zip --verify-tag --generate-notes
