name: Build and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build application and acceptance harness
        shell: pwsh
        run: msbuild ExplorerTabUtility.sln /restore /p:Configuration=Release /p:RuntimeIdentifier=win-${{ matrix.arch }} /v:minimal
      - name: Publish
        shell: pwsh
        run: msbuild ExplorerTabUtility/ExplorerTabUtility.csproj /restore /t:Publish /p:Configuration=Release /p:RuntimeIdentifier=win-${{ matrix.arch }} /p:SelfContained=true /p:PublishDir=../publish/release/${{ matrix.arch }}/ /v:minimal
      - name: Check update package handling
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          & tests/ExplorerTabUtility.IntegrationTests/bin/Release/net10.0-windows10.0.19041.0/win-x64/ExplorerTabUtility.IntegrationTests.exe --updates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        id: package
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath ExplorerTabUtility/ExplorerTabUtility.csproj -Encoding utf8 -Raw
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v' + $project.Project.PropertyGroup.Version + '-' + $env:GITHUB_SHA.Substring(0, 7) }
          $name = "ExplorerTabUtility_$($version)_${{ matrix.arch }}_WinUI3.zip"
          $source = 'publish/release/${{ matrix.arch }}'
          ./tools/Package.ps1 -Source $source -Destination $name
          "name=$name" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/*.zip --verify-tag --notes-file .github/release-notes.md --latest
